# kvssd workspace (DESIGN §24). The crate list, the crate dependency graph (§24.2, enforced by
# ci/check_graph.sh) and every crate's public interface are frozen: changes go through the
# integrator (see crates/OWNERSHIP.md).

[workspace]
resolver = "3"
members = ["crates/*", "tests/crash/faultdev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aryehlev/ssd-kv"
publish = false

# DESIGN §24.13. Versions are minimums; every one listed in §24.13 exists on crates.io, so no
# substitution was needed. Cargo.lock pins each resolved crate to a release published at least
# two weeks before 2026-11-01.
[workspace.dependencies]
# internal crates
kv-common = { path = "crates/kv-common" }
kv-resp = { path = "crates/kv-resp" }
kv-cmd = { path = "crates/kv-cmd" }
kv-index = { path = "crates/kv-index" }
kv-storage = { path = "crates/kv-storage" }
kv-repl = { path = "crates/kv-repl" }
kv-ctrl = { path = "crates/kv-ctrl" }
kv-topo = { path = "crates/kv-topo" }
kv-coord = { path = "crates/kv-coord" }

# external crates
io-uring = "0.7.13"
libc = "0.2.180"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
crc32c = "0.6.8"
memchr = "2.7"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
bitflags = "2.6"
hashbrown = "0.16"
foldhash = "0.2"
crossbeam-queue = "0.3.11"
crossbeam-utils = "0.8.21"
parking_lot = "0.12.3"
core_affinity = "0.8.1"
itoa = "1.0"
ryu = "1.0"
serde = { version = "1.0.219", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0"
hdrhistogram = { version = "7.5", default-features = false }
static_assertions = "1.1"
rand = "0.9"
mimalloc = { version = "0.1.48", default-features = false }
cc = "1.2"

# dev / test only
proptest = "1.6"
tempfile = "3.20"
# default features off: the default "script" feature pulls a SHA-1 crate (LC-06).
redis = { version = "1.7", default-features = false }
stateright = "0.31"
# default features off: the default plotting feature pulls a wasm-only allocator crate (LC-05).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
