# cargo-deny configuration (DESIGN §24.13, §25.7; LC-05, LC-06, LC-22, LC-31).
#   cargo deny --manifest-path Cargo.toml --config ci/deny.toml check

[graph]
# Linux only; this also keeps wasm-only dependencies of dev tooling out of the checked graph.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Everything not listed is refused, in particular AGPL-3.0*, SSPL-1.0, BUSL-1.1, GPL-* and LGPL-*.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
# xxhash-rust (required by §24.13 for key fingerprints) is published under the Boost Software
# License 1.0 only; it is permissive and is allowed for that crate alone.
exceptions = [
    { name = "xxhash-rust", allow = ["BSL-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # LC-06 / LC-31: no cryptographic hashing anywhere (key identity uses xxh3, integrity CRC32C)
    { name = "sha1" },
    { name = "sha1_smol" },
    { name = "sha2" },
    { name = "sha3" },
    { name = "md-5" },
    { name = "md5" },
    { name = "blake2" },
    { name = "blake3" },
    { name = "ripemd" },
    { name = "siphasher" },
    # LC-22: no GPU code
    { name = "cudarc" },
    { name = "cuda-sys" },
    { name = "cust" },
    { name = "wgpu" },
    { name = "vulkano" },
    { name = "ocl" },
    { name = "opencl3" },
    # LC-05: no pooled or bump allocators
    { name = "bumpalo" },
    { name = "typed-arena" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
